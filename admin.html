<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dentiste Affiliate Center (TEST)</title>
<link rel="icon" href="/logo-green.png">
<base target="_top">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ===== Dentiste Affiliate Center — หลังบ้านทีม (สีทึบ ไม่ไล่สี) ===== */
  :root {
    --font: 'Noto Sans Thai', -apple-system, system-ui, 'Segoe UI', sans-serif;
    --green: #007864; --green-dark: #005A4B; --green-tint: #E8F2EF; --green-line: #B9DCD3;
    --top: #0E1F1B; --bg: #F3F5F4; --card: #FFFFFF; --line: #E4E9E7; --line-strong: #D3DCD8; --head: #F6F8F7;
    --ink: #14211E; --muted: #66736F; --faint: #98A39F;
    --warn: #9A5B00; --warn-tint: #FFF3DC; --bad: #B42318; --bad-tint: #FDECEA; --info: #1F5FBF; --info-tint: #E8F0FC;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: var(--green); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .num { font-variant-numeric: tabular-nums; }
  .muted { color: var(--muted); }
  .faint { color: var(--faint); }

  /* ===== Top bar ===== */
  .top { position: fixed; inset: 0 0 auto 0; height: 52px; z-index: 20; background: var(--top); color: #fff; display: flex; align-items: center; gap: 14px; padding: 0 16px; }
  .top .burger { display: none; background: none; border: 0; color: #fff; padding: 6px; cursor: pointer; }
  .top .brand { display: flex; align-items: center; gap: 14px; }
  .top .brand img { height: 22px; width: auto; display: block; }
  .top .brand .fallback { font-weight: 700; font-size: 17px; }
  .top .brand .sep { width: 1px; height: 20px; background: rgba(255,255,255,.45); }
  .top .brand b { font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .top .sp { flex: 1; }
  .top .tbtn { background: rgba(255,255,255,.1); border: 0; color: #fff; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; }
  .top .tbtn:hover { background: rgba(255,255,255,.18); }
  .top .icon { position: relative; background: none; border: 0; color: #fff; padding: 6px; cursor: pointer; display: grid; place-items: center; }
  .top .icon svg { width: 22px; height: 22px; }
  .top .dot[hidden] { display: none; }
  .top .dot { position: absolute; top: 0; right: -2px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #E5484D; color: #fff; font-size: 11px; font-weight: 700; display: grid; place-items: center; }
  .top .me { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .top .me i { width: 30px; height: 30px; border-radius: 50%; background: var(--green); display: grid; place-items: center; font-style: normal; font-weight: 700; border: 1.5px solid rgba(255,255,255,.6); }

  /* ===== Side nav ===== */
  .side { position: fixed; top: 52px; bottom: 0; left: 0; width: 214px; z-index: 15; background: #fff; border-right: 1px solid var(--line); padding: 14px 8px; overflow-y: auto; display: flex; flex-direction: column; }
  .side a { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-radius: 8px; color: var(--ink); font-size: 14px; cursor: pointer; margin-bottom: 2px; text-decoration: none; }
  .side a svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .side a:hover { background: var(--bg); }
  .side a.on { background: var(--green-tint); color: var(--green); font-weight: 600; }
  .side a .badge { margin-left: auto; }
  .side hr { border: 0; border-top: 1px solid var(--line); margin: 10px 6px; }
  .side .foot { margin-top: auto; font-size: 12px; color: var(--faint); padding: 8px 12px; }

  /* ===== Main ===== */
  main { margin: 52px 0 0 214px; padding: 24px 24px 60px; min-height: calc(100vh - 52px); }
  .ph { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 6px; }
  .ph h1 { margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -.01em; flex: 1; }
  .ph .acts { display: flex; gap: 8px; }
  .tabs { display: flex; gap: 26px; border-bottom: 1px solid var(--line); margin: 10px 0 16px; overflow-x: auto; }
  .tabs button { background: none; border: 0; padding: 10px 0; cursor: pointer; font-weight: 500; color: var(--ink); border-bottom: 2px solid transparent; white-space: nowrap; }
  .tabs button.on { color: var(--green); border-bottom-color: var(--green); font-weight: 600; }
  .tabs button .c { color: var(--muted); font-weight: 400; margin-left: 4px; }
  .card { background: var(--card); border-radius: 10px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--line); }
  .card h2 { margin: 0 0 14px; font-size: 16px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
  .card h2 .sp { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
  .grid2.msg2 { grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); }

  /* ===== Buttons / inputs ===== */
  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid transparent; border-radius: 6px; padding: 7px 14px; cursor: pointer; font-weight: 500; background: var(--green); color: #fff; white-space: nowrap; text-decoration: none; }
  .btn:hover { background: var(--green-dark); text-decoration: none; }
  .btn svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .btn.sec { background: #EEF1F0; color: var(--ink); }
  .btn.sec:hover { background: #E2E8E5; }
  .btn.line { background: #fff; color: var(--ink); border-color: var(--line-strong); }
  .btn.line:hover { background: var(--bg); }
  .btn.danger { background: #fff; color: var(--bad); border-color: #F2C4BF; }
  .btn.danger:hover { background: var(--bad-tint); }
  .btn.sm { padding: 4px 10px; font-size: 13px; }
  .btn[disabled] { opacity: .5; cursor: not-allowed; }
  .link { background: none; border: 0; color: var(--green); cursor: pointer; padding: 0; font-weight: 500; }
  .link.off { color: #A8D3CA; cursor: default; }
  .fld { display: flex; align-items: center; border: 1px solid var(--line-strong); border-radius: 6px; background: #fff; min-height: 36px; padding: 0 12px; gap: 10px; position: relative; }
  .fld > span { white-space: nowrap; }
  .fld input, .fld select { border: 0; outline: 0; flex: 1; min-width: 0; background: transparent; padding: 7px 0; color: var(--ink); }
  .fld select { -webkit-appearance: none; appearance: none; cursor: pointer; padding-right: 18px; color: var(--muted); }
  .fld select.set { color: var(--ink); }
  .fld .chev { position: absolute; right: 12px; pointer-events: none; color: var(--muted); }
  .fld:focus-within { border-color: var(--green); }
  .filters { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .filters .wide { grid-column: span 2; }
  .chk { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
  .chk input { width: 16px; height: 16px; accent-color: var(--green); margin: 0; }
  .frow { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; }
  .frow .sp { flex: 1; }
  label.f { display: block; font-weight: 500; margin: 12px 0 5px; }
  input.in, select.in, textarea.in { width: 100%; border: 1px solid var(--line-strong); border-radius: 6px; padding: 8px 10px; background: #fff; outline: 0; }
  input.in:focus, select.in:focus, textarea.in:focus { border-color: var(--green); }
  textarea.in { min-height: 110px; resize: vertical; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { border: 1px solid var(--line-strong); background: #fff; border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 13px; }
  .chip.on { background: var(--green); border-color: var(--green); color: #fff; }

  /* ===== Table ===== */
  .tools { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; align-items: center; }
  .tools .sel { color: var(--muted); font-size: 13px; margin-left: 4px; }
  .twrap { overflow-x: auto; border-radius: 8px; }
  table.t { width: 100%; border-collapse: collapse; min-width: 880px; }
  table.t th { background: var(--head); text-align: left; font-size: 12.5px; font-weight: 600; color: var(--ink); padding: 11px 12px; white-space: nowrap; user-select: none; }
  table.t th.r, table.t td.r { text-align: right; }
  table.t th.s { cursor: pointer; }
  table.t th.s::after { content: '⇅'; color: var(--faint); margin-left: 4px; font-size: 11px; }
  table.t th.s.asc::after { content: '↑'; color: var(--green); }
  table.t th.s.desc::after { content: '↓'; color: var(--green); }
  table.t td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.t tr:hover td { background: #FAFBFB; }
  table.t td.ck, table.t th.ck { width: 36px; padding-right: 0; }
  table.t td.act { white-space: nowrap; position: sticky; right: 0; background: #fff; box-shadow: -6px 0 8px -6px rgba(0,0,0,.08); }
  table.t th.act { position: sticky; right: 0; box-shadow: -6px 0 8px -6px rgba(0,0,0,.08); }
  table.t tr:hover td.act { background: #FAFBFB; }
  .who { display: flex; gap: 10px; align-items: center; min-width: 200px; cursor: pointer; }
  .av { width: 40px; height: 40px; border-radius: 50%; flex: none; display: grid; place-items: center; font-weight: 700; color: #fff; font-size: 15px; }
  .who > div b { display: block; font-weight: 600; }
  .who > div span { display: block; color: var(--muted); font-size: 13px; }
  .who:hover b { color: var(--green); }
  .ia { background: none; border: 0; padding: 5px; border-radius: 6px; cursor: pointer; color: var(--green); display: inline-grid; place-items: center; }
  .ia:hover { background: var(--green-tint); }
  .ia svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .tag { display: inline-block; background: #EEF1F0; color: var(--ink); border-radius: 4px; padding: 1px 8px; font-size: 12px; margin: 0 4px 4px 0; }
  .badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; background: #EEF1F0; color: var(--muted); white-space: nowrap; }
  .badge.good { background: var(--green-tint); color: var(--green-dark); }
  .badge.warn { background: var(--warn-tint); color: var(--warn); }
  .badge.bad { background: var(--bad-tint); color: var(--bad); }
  .badge.info { background: var(--info-tint); color: var(--info); }
  .badge.dark { background: var(--top); color: #fff; }
  .num-link { color: var(--green); font-weight: 500; }
  .pager { display: flex; justify-content: flex-end; align-items: center; gap: 10px; padding-top: 14px; color: var(--muted); }
  .empty { text-align: center; color: var(--muted); padding: 40px 10px; }

  /* ===== Home ===== */
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; margin-bottom: 16px; }
  .kpi { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .kpi .k { color: var(--muted); font-size: 12.5px; }
  .kpi .v { font-size: 22px; font-weight: 700; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .kpi .d { font-size: 12px; margin-top: 2px; }
  .up { color: var(--green); } .down { color: var(--bad); }
  .todo { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .todo button { display: flex; align-items: center; gap: 12px; text-align: left; background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; cursor: pointer; }
  .todo button:hover { border-color: var(--green-line); background: #FAFDFC; }
  .todo b { font-size: 22px; font-weight: 700; min-width: 32px; font-variant-numeric: tabular-nums; }
  .todo button.hot b { color: var(--bad); }
  .todo span { color: var(--muted); font-size: 13px; line-height: 1.35; }
  .funnel .fr { display: grid; grid-template-columns: 210px 1fr 60px; gap: 12px; align-items: center; margin-bottom: 8px; cursor: pointer; }
  .funnel .bar { height: 22px; background: var(--bg); border-radius: 4px; overflow: hidden; }
  .funnel .bar div { height: 100%; background: var(--green); border-radius: 4px; min-width: 2px; }
  .funnel .fr:nth-child(odd) .bar div { background: var(--green-dark); }
  .funnel .fr span { font-size: 13px; }
  .list .li { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .list .li:last-child { border-bottom: 0; }
  .list .li .sp { flex: 1; min-width: 0; }
  .rk { width: 26px; height: 26px; border-radius: 50%; background: #EEF1F0; display: grid; place-items: center; font-size: 12px; font-weight: 700; flex: none; }
  .rk.r1 { background: var(--green); color: #fff; }

  /* ===== Campaign cards ===== */
  .camp { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
  .cc { background: #fff; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; }
  .cc:hover { border-color: var(--green-line); }
  .cc .hd { background: var(--green); color: #fff; padding: 16px 18px; }
  .cc .hd.off { background: #5E6B67; }
  .cc .hd b { font-size: 18px; display: block; }
  .cc .hd span { font-size: 12.5px; opacity: .9; }
  .cc .bd { padding: 14px 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .cc .bd div { font-size: 12px; color: var(--muted); }
  .cc .bd b { display: block; font-size: 17px; color: var(--ink); font-variant-numeric: tabular-nums; }

  /* ===== Video cards ===== */
  .vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; }
  .vc { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .vc .url { font-size: 12.5px; word-break: break-all; }
  .vc .row { display: flex; gap: 8px; align-items: center; }
  .vc .row .sp { flex: 1; }

  /* ===== Drawer / modal / toast ===== */
  .scrim { position: fixed; inset: 0; background: rgba(14, 31, 27, .38); z-index: 40; display: none; }
  .scrim.show { display: block; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: #fff; z-index: 41; transform: translateX(100%); transition: transform .22s ease; display: flex; flex-direction: column; box-shadow: -10px 0 30px rgba(0,0,0,.12); }
  .drawer.show { transform: none; }
  .drawer .dh { display: flex; align-items: center; gap: 12px; padding: 18px 20px; border-bottom: 1px solid var(--line); }
  .drawer .dh .sp { flex: 1; min-width: 0; }
  .drawer .db { padding: 18px 20px; overflow-y: auto; flex: 1; }
  .drawer h3 { font-size: 14px; margin: 18px 0 8px; }
  .kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 13.5px; }
  .kv div:nth-child(odd) { color: var(--muted); }
  .mini { width: 100%; border-collapse: collapse; font-size: 13px; }
  .mini td, .mini th { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: left; }
  .mini th { color: var(--muted); font-weight: 500; }
  .x { background: none; border: 0; cursor: pointer; font-size: 22px; line-height: 1; color: var(--muted); padding: 4px 8px; }
  .modal { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(520px, calc(100vw - 32px)); max-height: calc(100vh - 40px); overflow-y: auto; background: #fff; border-radius: 12px; z-index: 50; display: none; box-shadow: 0 20px 50px rgba(0,0,0,.2); }
  .modal.show { display: block; }
  .modal .mh { display: flex; align-items: center; padding: 16px 20px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 16px; }
  .modal .mh .sp { flex: 1; }
  .modal .mb { padding: 4px 20px 16px; }
  .modal .mf { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 20px 18px; }
  .mscrim { z-index: 49; }
  .menu { position: absolute; z-index: 60; background: #fff; border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,.12); padding: 6px; min-width: 170px; }
  .menu button { display: block; width: 100%; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; }
  .menu button:hover { background: var(--bg); }
  .menu button.bad { color: var(--bad); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translate(-50%, 20px); background: var(--top); color: #fff; padding: 11px 18px; border-radius: 8px; z-index: 70; opacity: 0; transition: .2s; pointer-events: none; max-width: calc(100vw - 32px); }
  .toast.show { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: var(--bad); }
  .loading { padding: 60px; text-align: center; color: var(--muted); }
  .spin { width: 28px; height: 28px; border: 3px solid var(--green-tint); border-top-color: var(--green); border-radius: 50%; animation: sp .8s linear infinite; margin: 0 auto 10px; }
  @keyframes sp { to { transform: rotate(360deg); } }
  .deny { max-width: 520px; margin: 80px auto; text-align: center; }
  .mockbar { position: fixed; left: 214px; right: 0; bottom: 0; background: var(--warn-tint); color: var(--warn); font-size: 12px; text-align: center; padding: 4px; z-index: 10; }

  @media (max-width: 1200px) { .kpis { grid-template-columns: repeat(3, 1fr); } .todo { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 900px) {
    .top .burger { display: grid; }
    .top .me span, .top .tbtn { display: none; }
    .side { transform: translateX(-100%); transition: transform .2s; box-shadow: 4px 0 20px rgba(0,0,0,.1); }
    .side.show { transform: none; }
    main { margin-left: 0; padding: 18px 16px 60px; }
    .mockbar { left: 0; }
    .filters, .grid2, .grid3, .grid2.msg2 { grid-template-columns: minmax(0, 1fr); }
    .filters .wide { grid-column: auto; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .todo { grid-template-columns: 1fr; }
    .funnel .fr { grid-template-columns: 130px 1fr 44px; }
    .top .brand b { font-size: 15px; }
  }
  /* ===== Responsive: Tablet + Mobile ===== */
  .sscrim { position: fixed; inset: 52px 0 0 0; background: rgba(14, 31, 27, .38); z-index: 14; display: none; }
  .fbtn { display: none; }
  @media (max-width: 1024px) and (min-width: 901px) {
    .side { width: 190px; } main { margin-left: 190px; padding: 20px 18px 60px; } .mockbar { left: 190px; }
    .grid3 { grid-template-columns: 1fr 1fr; }
    .funnel .fr { grid-template-columns: 160px 1fr 50px; }
  }
  @media (max-width: 900px) {
    .sscrim.show { display: block; }
    .side { width: min(280px, 82vw); }
    .side a { padding: 11px 12px; }
    .ph { flex-wrap: wrap; }
    .ph .acts { flex-wrap: wrap; }
    .camp, .vgrid { grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
  }
  @media (max-width: 900px) and (min-width: 641px) {
    .filters { grid-template-columns: 1fr 1fr; }
    .filters .wide, .filters .frow { grid-column: 1 / -1; }
    .kpis { grid-template-columns: repeat(3, 1fr); }
    .todo { grid-template-columns: 1fr 1fr; }
  }
  @media (max-width: 640px) {
    html, body { font-size: 14.5px; }
    .top { gap: 6px; padding: 0 8px; }
    .top .brand { gap: 8px; min-width: 0; }
    .top .brand img { height: 18px; }
    .top .brand .sep { height: 16px; }
    .top .brand b { font-size: 14px; line-height: 1.15; white-space: nowrap; }
    .top #sheetlink { display: none; }
    .top .logout { padding: 4px 8px; font-size: 12px; white-space: nowrap; }
    .top .me i { width: 28px; height: 28px; }
    main { padding: 14px 12px 70px; }
    .ph { gap: 8px; }
    .ph h1 { font-size: 22px; flex-basis: 100%; }
    .ph .acts { width: 100%; }
    .ph .acts .btn { flex: 1 1 auto; }
    .tabs { gap: 18px; margin: 6px 0 12px; }
    .card { padding: 14px; border-radius: 12px; }
    .kpis { gap: 8px; } .kpi { padding: 12px; } .kpi .v { font-size: 19px; }
    .todo b { font-size: 19px; }
    .funnel .fr { grid-template-columns: 96px 1fr 38px; gap: 8px; }
    .funnel .fr span { font-size: 12px; }
    .tools { gap: 8px; } .tools .btn { flex: 1 1 auto; }
    .tools .sel { flex-basis: 100%; margin: 0; }
    .camp, .vgrid { grid-template-columns: 1fr; }
    .cc .bd { grid-template-columns: repeat(2, 1fr); }
    .kv { grid-template-columns: 104px 1fr; }
    .drawer .dh, .drawer .db { padding-left: 16px; padding-right: 16px; }
    .modal .mb, .modal .mh { padding-left: 16px; padding-right: 16px; }
    .modal .mf { flex-wrap: wrap; padding: 12px 16px 16px; } .modal .mf .btn { flex: 1 1 auto; }
    .btn { min-height: 38px; }
    .fld { min-height: 42px; }
    input.in, select.in, textarea.in, .fld input, .fld select { font-size: 16px; } /* กัน iOS ซูมเวลาแตะช่องกรอก */
    .mini { display: block; overflow-x: auto; white-space: nowrap; }
    /* ตัวกรอง: พับเก็บ กดปุ่มเพื่อเปิด */
    .fbtn { display: flex; width: 100%; align-items: center; gap: 8px; background: none; border: 0; padding: 2px 0; font-weight: 600; cursor: pointer; color: var(--ink); }
    .fbtn .n { background: var(--green); color: #fff; border-radius: 999px; font-size: 11px; padding: 0 7px; }
    .fbtn .chv { margin-left: auto; transition: transform .2s; color: var(--muted); }
    .fopen > .fbtn .chv { transform: rotate(180deg); }
    .fwrap > .filters { display: none; margin-top: 12px; }
    .fwrap.fopen > .filters { display: grid; }
    /* ตาราง → การ์ด */
    .twrap { overflow: visible; }
    table.t { min-width: 0 !important; display: block; }
    table.t td [style*="max-width"] { max-width: 100% !important; }
    table.t thead { display: none; }
    table.t tbody { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; }
    table.t td { min-width: 0; overflow-wrap: anywhere; }
    table.t tr { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); column-gap: 16px; position: relative; border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; background: #fff; }
    table.t td.lead, table.t td.act, table.t td.wide { grid-column: 1 / -1; }
    table.t td[colspan] { grid-column: 1 / -1; display: block; text-align: center; }
    table.t td.wide { flex-direction: column; align-items: stretch; gap: 2px; text-align: left; }
    table.t td.wide::before { max-width: none; }
    table.t tr:hover td { background: transparent; }
    table.t td { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--line); text-align: right; }
    table.t td.r { text-align: right; }
    table.t td::before { content: attr(data-l); color: var(--muted); font-size: 12.5px; text-align: left; flex: none; max-width: 60%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    table.t td:not([data-l])::before, table.t td[data-l=""]::before { display: none; }
    table.t td:last-child { border-bottom: 0; }
    table.t td.lead { display: block; text-align: left; padding: 6px 34px 10px 0; border-bottom: 1px solid var(--line); }
    table.t td.lead::before { display: none; }

    table.t td.ck { position: absolute; top: 12px; right: 12px; width: auto; padding: 0; border: 0; }
    table.t td.ck::before { display: none; }
    table.t td.ck input { width: 20px; height: 20px; }
    table.t td.act { position: static; box-shadow: none; justify-content: flex-end; gap: 4px; background: transparent; padding-top: 8px; }
    table.t td.act::before { display: none; }
    table.t td.act .ia { padding: 8px; }
    table.t td.act .ia svg { width: 20px; height: 20px; }
    .pager { justify-content: center; flex-wrap: wrap; }

  }
  @media (max-width: 430px) {

  /* ================================================================
     iOS 27 theme — Liquid Glass (แก้เฉพาะหน้าตา ไม่แตะการทำงาน)
     ================================================================ */
  :root {
    --bg: #F2F4F3; --head: transparent; --line: rgba(60, 60, 67, .12); --line-strong: rgba(60, 60, 67, .18);
    --fill: rgba(118, 118, 128, .12); --fill2: rgba(118, 118, 128, .08);
    --glass: rgba(255, 255, 255, .68); --glass-strong: rgba(255, 255, 255, .86);
    --glass-edge: rgba(255, 255, 255, .7);
    --shadow: 0 1px 2px rgba(16, 40, 34, .04), 0 8px 28px rgba(16, 40, 34, .06);
    --shadow-lg: 0 10px 40px rgba(16, 40, 34, .14), 0 2px 8px rgba(16, 40, 34, .06);
    --r: 22px; --r-sm: 14px; --blur: saturate(180%) blur(28px);
  }
  html, body { background: var(--bg); letter-spacing: -.003em; }
  body::before { content: ''; position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: radial-gradient(900px 520px at 85% -10%, rgba(0, 120, 100, .10), transparent 60%),
                radial-gradient(700px 480px at -10% 30%, rgba(217, 255, 74, .14), transparent 60%),
                radial-gradient(800px 600px at 60% 110%, rgba(0, 90, 75, .07), transparent 60%); }
  .glass, .top, .side, .drawer, .modal, .menu, .tabbar { -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

  /* แถบบน — กระจกใส */
  .top { background: var(--glass); color: var(--ink); border-bottom: .5px solid var(--line); box-shadow: inset 0 -1px 0 rgba(255,255,255,.5); height: 56px; }
  .top .brand img { content: url('/logo-green.png'); height: 24px; }
  .top .brand .sep { background: var(--line-strong); }
  .top .brand b { color: var(--ink); font-weight: 700; letter-spacing: -.01em; }
  .top .burger, .top .icon { color: var(--ink); border-radius: 50%; width: 38px; height: 38px; place-items: center; }
  .top .icon { display: grid; }
  .top .burger:hover, .top .icon:hover { background: var(--fill2); }
  .top .tbtn { background: var(--green); color: #fff; border-radius: 999px; padding: 8px 16px; font-weight: 600; box-shadow: 0 4px 14px rgba(0,120,100,.25); }
  .top .tbtn:hover { background: var(--green-dark); }
  .top .dot { background: #FF3B30; border: 2px solid #fff; }
  .top .me { color: var(--muted); }
  .top .me i { border: 0; box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.12); }
  .top .logout { color: var(--ink) !important; border: 0 !important; background: var(--fill) !important; border-radius: 999px !important; padding: 6px 12px !important; font-weight: 500; }
  .sscrim { top: 56px; }

  /* เมนูข้าง — Sidebar แบบ iPadOS */
  .side { top: 56px; background: rgba(255,255,255,.55); border-right: .5px solid var(--line); padding: 16px 10px; }
  .side a { border-radius: 12px; padding: 10px 12px; font-weight: 500; transition: background .15s, color .15s; }
  .side a svg { stroke-width: 1.9; color: var(--green); }
  .side a:hover { background: var(--fill2); }
  .side a.on { background: var(--green); color: #fff; font-weight: 600; box-shadow: 0 6px 18px rgba(0,120,100,.28); }
  .side a.on svg { color: #fff; }
  .side a.on .badge { background: rgba(255,255,255,.25); color: #fff; }
  .side hr { border-top-color: var(--line); }
  main { margin-top: 56px; min-height: calc(100vh - 56px); padding-top: 28px; }

  /* หัวข้อใหญ่แบบ iOS */
  .ph { align-items: center; margin-bottom: 10px; }
  .ph h1 { font-size: 32px; font-weight: 800; letter-spacing: -.025em; }

  /* Segmented control */
  .tabs { display: inline-flex; max-width: 100%; gap: 2px; padding: 3px; background: var(--fill); border: 0; border-radius: 12px; margin: 6px 0 18px; }
  .tabs button { padding: 7px 16px; border-radius: 9px; border: 0; color: var(--ink); font-weight: 500; font-size: 13.5px; transition: background .2s, box-shadow .2s; }
  .tabs button.on { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 3px 8px rgba(0,0,0,.06); border: 0; }
  .tabs button .c { color: var(--faint); }

  /* การ์ด */
  .card { background: var(--glass-strong); border: .5px solid var(--glass-edge); border-radius: var(--r); box-shadow: var(--shadow); padding: 22px; }
  .card h2 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .kpi { background: var(--glass-strong); border: .5px solid var(--glass-edge); border-radius: 18px; box-shadow: var(--shadow); padding: 16px 18px; }
  .kpi .k { font-size: 12.5px; font-weight: 500; }
  .kpi .v { font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
  .todo button { background: var(--glass-strong); border: .5px solid var(--glass-edge); border-radius: 16px; box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .todo button:hover { transform: translateY(-1px); box-shadow: var(--shadow-lg); border-color: var(--glass-edge); background: #fff; }
  .funnel .bar { background: var(--fill2); border-radius: 999px; height: 12px; }
  .funnel .bar div, .funnel .fr:nth-child(odd) .bar div { border-radius: 999px; background: linear-gradient(90deg, #007864, #1A9C84); }
  .rk { background: var(--fill); } .rk.r1 { background: var(--green); }
  .list .li { border-bottom: .5px solid var(--line); }
  .cc { background: var(--glass-strong); border: .5px solid var(--glass-edge); border-radius: var(--r); box-shadow: var(--shadow); transition: transform .15s, box-shadow .15s; }
  .cc:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); border-color: var(--glass-edge); }
  .cc .hd { background: linear-gradient(135deg, #007864, #005A4B); padding: 18px 20px; }
  .vc { background: var(--glass-strong); border: .5px solid var(--glass-edge); border-radius: 18px; box-shadow: var(--shadow); }

  /* ปุ่มทรงแคปซูล */
  .btn { border-radius: 999px; padding: 8px 16px; font-weight: 600; transition: background .15s, transform .1s, box-shadow .15s; box-shadow: 0 4px 14px rgba(0,120,100,.22); }
  .btn:active { transform: scale(.97); }
  .btn.sec { background: rgba(0,120,100,.10); color: var(--green); box-shadow: none; }
  .btn.sec:hover { background: rgba(0,120,100,.16); }
  .btn.line { background: rgba(255,255,255,.8); border: .5px solid var(--line-strong); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
  .btn.danger { background: rgba(255,59,48,.08); color: #D70015; border: 0; box-shadow: none; }
  .btn.danger:hover { background: rgba(255,59,48,.14); }
  .btn.sm { padding: 5px 12px; }
  .ia { border-radius: 50%; width: 34px; height: 34px; }
  .ia:hover { background: rgba(0,120,100,.10); }
  .chip { border: 0; background: var(--fill); padding: 6px 14px; font-weight: 500; }
  .chip.on { background: var(--green); color: #fff; box-shadow: 0 4px 12px rgba(0,120,100,.25); }

  /* ช่องกรอกแบบ iOS (พื้นเทา ไม่มีขอบ) */
  .fld { background: var(--fill); border: 0; border-radius: 12px; min-height: 40px; transition: box-shadow .15s, background .15s; }
  .fld > span:first-child { color: var(--muted); font-weight: 500; }
  .fld:focus-within { background: #fff; box-shadow: 0 0 0 3px rgba(0,120,100,.25); }
  input.in, select.in, textarea.in { background: var(--fill); border: 0; border-radius: 12px; padding: 10px 12px; transition: box-shadow .15s, background .15s; }
  input.in:focus, select.in:focus, textarea.in:focus { background: #fff; box-shadow: 0 0 0 3px rgba(0,120,100,.25); }
  label.f { font-size: 13px; color: var(--muted); font-weight: 600; text-transform: none; }

  /* Checkbox วงกลม + Radio แบบ iOS */
  table.t input[type=checkbox], .chk input[type=checkbox], .chk input[type=radio] {
    -webkit-appearance: none; appearance: none; width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid rgba(60,60,67,.3);
    background: #fff; display: inline-grid; place-items: center; cursor: pointer; transition: background .15s, border-color .15s; flex: none; margin: 0; }
  table.t input[type=checkbox]:checked, .chk input:checked { background: var(--green); border-color: var(--green); }
  table.t input[type=checkbox]:checked::after, .chk input[type=checkbox]:checked::after { content: ''; width: 6px; height: 11px; border: solid #fff; border-width: 0 2.2px 2.2px 0; transform: translateY(-1px) rotate(45deg); }
  .chk input[type=radio]:checked::after { content: ''; width: 8px; height: 8px; border-radius: 50%; background: #fff; }

  /* ตาราง (Desktop/Tablet) */
  .twrap { border-radius: 16px; }
  table.t th { background: transparent; color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .03em; border-bottom: .5px solid var(--line); }
  table.t td { border-bottom: .5px solid var(--line); }
  table.t tr:hover td { background: rgba(0,120,100,.035); }
  table.t td.act, table.t th.act { background: rgba(255,255,255,.92); }
  table.t tr:hover td.act { background: #F6FAF9; }
  .av { box-shadow: 0 0 0 2px #fff, 0 2px 6px rgba(0,0,0,.10); }
  .tag { background: var(--fill); border-radius: 999px; padding: 2px 10px; }
  .badge { padding: 2px 10px; font-weight: 600; }
  .badge.good { background: rgba(52,199,89,.14); color: #1E7B3A; }
  .badge.warn { background: rgba(255,149,0,.15); color: #A85A00; }
  .badge.bad { background: rgba(255,59,48,.12); color: #C4141B; }
  .badge.info { background: rgba(0,122,255,.12); color: #0A60C9; }

  /* Sheet / Modal / Menu / Toast */
  .scrim { background: rgba(10, 25, 22, .28); -webkit-backdrop-filter: blur(3px); backdrop-filter: blur(3px); }
  .drawer { background: rgba(255,255,255,.88); border-radius: 26px 0 0 26px; box-shadow: var(--shadow-lg); border-left: .5px solid var(--glass-edge); transition: transform .32s cubic-bezier(.32,.72,0,1); }
  .drawer .dh { border-bottom: .5px solid var(--line); }

  .menu { background: rgba(255,255,255,.82); border: .5px solid var(--glass-edge); border-radius: 16px; box-shadow: var(--shadow-lg); padding: 6px; }
  .menu button { border-radius: 10px; padding: 9px 12px; font-weight: 500; }
  .x { width: 32px; height: 32px; border-radius: 50%; background: var(--fill); font-size: 18px; display: grid; place-items: center; padding: 0; }
  .toast { border-radius: 999px; padding: 12px 20px; background: rgba(20, 33, 30, .86); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); box-shadow: var(--shadow-lg); font-weight: 500; }
  .toast.err { background: rgba(215, 0, 21, .9); }
  .spin { border-color: rgba(0,120,100,.15); border-top-color: var(--green); }
  .mockbar { background: rgba(255, 243, 220, .9); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur); }

  /* แถบแท็บล่างลอย (มือถือ) */
  .tabbar { display: none; }
  @media (max-width: 900px) {
    .side { background: rgba(255,255,255,.86); border-radius: 0 24px 24px 0; top: 56px; }
    .drawer { border-radius: 26px 26px 0 0; top: 6vh; }
  }
  @media (max-width: 640px) {
    main { padding: 18px 14px 120px; }

    .tabs button { flex: 1 0 auto; padding: 7px 12px; }

    table.t td { border-bottom: .5px solid var(--line); }

      background: rgba(255,255,255,.72); border: .5px solid var(--glass-edge); border-radius: 30px; box-shadow: var(--shadow-lg); padding: 6px; justify-content: space-around; }

    .tabbar button svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
    .tabbar button.on { color: var(--green); background: rgba(0,120,100,.10); }

    .tabbar .bd[hidden] { display: none; }

    .toast { bottom: calc(96px + env(safe-area-inset-bottom)); }

  }
  /* ================================================================
     Dashboard — กราฟ + Motion
     ================================================================ */
  @keyframes dvUp { from { opacity: 0; transform: translateY(14px) scale(.985); } }
  @keyframes dvGrowX { from { width: 0; } }
  @keyframes dvGrowY { from { height: 0; } }
  @keyframes dvDash { from { stroke-dasharray: 0 var(--C); } }
  @keyframes dvPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(52,199,89,.45); } 50% { box-shadow: 0 0 0 6px rgba(52,199,89,0); } }
  .kpis .kpi { animation: dvUp .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(var(--i, 0) * 60ms); }
  .kpi .k { display: flex; align-items: center; gap: 8px; }
  .ki { width: 26px; height: 26px; border-radius: 8px; display: inline-grid; place-items: center; background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); flex: none; font-style: normal; }
  .ki svg { width: 15px; height: 15px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #app > .kpis ~ .card, #app > .kpis ~ .grid2 > .card { animation: dvUp .6s cubic-bezier(.2,.8,.2,1) both; animation-delay: .25s; }
  .funnel .bar div { background: var(--c, var(--green)) !important; animation: dvGrowX 1s cubic-bezier(.2,.8,.2,1) both; animation-delay: calc(.35s + var(--i, 0) * 70ms); }
  .dv-go { opacity: 0; transform: translateY(14px); transition: opacity .6s cubic-bezier(.2,.8,.2,1), transform .6s cubic-bezier(.2,.8,.2,1); transition-delay: calc(var(--i, 0) * 80ms); }
  .dv-go.in { opacity: 1; transform: none; }
  .dv-skel { display: grid; gap: 8px; padding: 34px; }
  .dv-sec { display: flex; align-items: baseline; gap: 10px; margin: 26px 2px 12px; flex-wrap: wrap; }
  .dv-sec h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -.02em; display: flex; align-items: center; gap: 10px; }
  .dv-sec .ki { width: 30px; height: 30px; border-radius: 10px; }
  .dv-sum { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .dv-s { position: relative; overflow: hidden; border-radius: 18px; padding: 16px 18px; color: #fff; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 70%, #000)); box-shadow: 0 10px 26px color-mix(in srgb, var(--c) 30%, transparent); animation: dvUp .6s cubic-bezier(.2,.8,.2,1) both; }
  .dv-s:nth-child(2) { animation-delay: .06s; } .dv-s:nth-child(3) { animation-delay: .12s; } .dv-s:nth-child(4) { animation-delay: .18s; }
  .dv-s::after { content: ''; position: absolute; width: 120px; height: 120px; right: -36px; top: -46px; border-radius: 50%; background: rgba(255,255,255,.16); }
  .dv-s > span { display: block; font-size: 12.5px; opacity: .9; font-weight: 500; }
  .dv-s b { display: block; font-size: 26px; font-weight: 800; letter-spacing: -.02em; margin-top: 2px; font-variant-numeric: tabular-nums; }
  .dv-camps { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .dv-camp { background: var(--glass-strong); border: .5px solid var(--glass-edge); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; }
  .dv-ch { display: flex; align-items: flex-start; gap: 12px; padding: 18px 20px; color: #fff; background: linear-gradient(135deg, var(--c), color-mix(in srgb, var(--c) 65%, #001a15)); position: relative; overflow: hidden; }
  .dv-ch::after { content: ''; position: absolute; right: -40px; bottom: -60px; width: 160px; height: 160px; border-radius: 50%; background: rgba(217,255,74,.18); }
  .dv-ch > div { flex: 1; min-width: 0; position: relative; z-index: 1; }
  .dv-ch b { display: block; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
  .dv-ch > div > span { font-size: 12.5px; opacity: .9; }
  .dv-ch .badge { position: relative; z-index: 1; background: rgba(255,255,255,.92) !important; }
  .dv-ch .badge.good::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #34C759; margin-right: 6px; vertical-align: 1px; animation: dvPulse 1.8s infinite; }
  .dv-cm { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line); border-bottom: .5px solid var(--line); }
  .dv-m { background: rgba(255,255,255,.9); padding: 12px 14px; }
  .dv-m > span { display: block; font-size: 12px; color: var(--muted); }
  .dv-m b { display: block; font-size: 20px; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
  .dv-m em { font-style: normal; font-size: 11.5px; color: var(--faint); }
  .dv-cf { display: grid; grid-template-columns: minmax(0, 1fr); gap: 14px; padding: 16px 20px; }
